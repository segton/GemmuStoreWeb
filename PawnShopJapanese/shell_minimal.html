<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gemu Shoppu</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111418;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            width: 1200px;
            height: 675px;
            display: block;
            background: #000;
            outline: none;
        }

            #canvas:fullscreen {
                width: 100vw;
                height: 100vh;
            }

            #canvas:-webkit-full-screen {
                width: 100vw;
                height: 100vh;
            }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script>
        var Module = {
            canvas: document.getElementById("canvas")
        };

        function resizeCanvasToDisplay() {
            const canvas = Module.canvas;
            const rect = canvas.getBoundingClientRect();

            const w = Math.max(1, Math.floor(rect.width));
            const h = Math.max(1, Math.floor(rect.height));

            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
        }

        function enterGameFullscreen() {
            const canvas = Module.canvas;

            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) {
                canvas.webkitRequestFullscreen();
            }

            setTimeout(resizeCanvasToDisplay, 50);
            setTimeout(resizeCanvasToDisplay, 250);
            setTimeout(resizeCanvasToDisplay, 750);
        }

        window.enterGameFullscreen = enterGameFullscreen;

        Module.canvas.addEventListener("dblclick", function () {
            enterGameFullscreen();
        });

        window.addEventListener("resize", function () {
            setTimeout(resizeCanvasToDisplay, 50);
            setTimeout(resizeCanvasToDisplay, 250);
        });

        document.addEventListener("fullscreenchange", function () {
            setTimeout(resizeCanvasToDisplay, 50);
            setTimeout(resizeCanvasToDisplay, 250);
            setTimeout(resizeCanvasToDisplay, 750);
        });

        window.addEventListener("load", function () {
            resizeCanvasToDisplay();
        });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
